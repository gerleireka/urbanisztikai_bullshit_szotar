<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbanisztikai Bullshitszótár</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime:ital@0;1&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #ffffff;
    --page-bg: #ffffff;
    --ink: #111111;
    --faded-ink: #444444;
    --soft-border: #e0e0e0;
    --red-accent: #b0292a;
    --gold1: #c9a84c;
    --gold2: #f5e6a3;
    --gold3: #b8860b;
  }

  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'IM Fell English', serif;
    overflow: hidden;
    cursor: default;
  }

  .scene {
    perspective: 1200px;
    width: 420px;
    height: 560px;
    position: relative;
  }

  .hint {
    position: absolute;
    bottom: -68px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(0,0,0,0.35);
    font-size: 13px;
    font-family: 'Courier Prime', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    animation: pulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.65} }

  /* ---- NOTEBOOK ---- */
  .notebook {
    width: 420px;
    height: 560px;
    position: relative;
    transform-style: preserve-3d;
    cursor: pointer;
    left: 0;
    transition: left 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000);
  }

  /* Nyitott állapot középre tolása */
  .notebook.open {
    left: 210px;
  }

  /* COVER */
  .cover {
    position: absolute;
    inset: 0;
    background: #0a0a0a;
    border-radius: 3px 8px 8px 3px;
    box-shadow:
      -3px 0 6px rgba(0,0,0,0.25),
      6px 6px 28px rgba(0,0,0,0.22),
      inset 1px 0 0 rgba(255,255,255,0.03);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 10;
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    transform-origin: left center;
    transform-style: preserve-3d;
  }

  /* A borító belső, üres oldala */
  .cover-inner {
    position: absolute;
    inset: 4px 4px 4px 18px; /* Pontosan akkora, mint a jobb oldali lap */
    background: var(--page-bg);
    transform: rotateY(180deg) translateZ(1px);
    backface-visibility: hidden;
    border-radius: 0 4px 4px 0;
    box-shadow: inset 1px 0 4px rgba(0,0,0,0.06), -2px 2px 10px rgba(0,0,0,0.08);
  }

  .cover::before {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(201,168,76,0.35);
    border-radius: 2px;
    pointer-events: none;
    z-index: 1;
  }
  .cover::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 20px;
    background: linear-gradient(to right, rgba(255,255,255,0.04) 0%, transparent 100%);
    border-radius: 3px 0 0 3px;
    z-index: 2;
  }

  .cover-shimmer { display: none; }

  .cover-ornament {
    font-size: 20px;
    color: var(--gold1);
    opacity: 0.7;
    z-index: 4;
    text-shadow: 0 0 8px rgba(201,168,76,0.4);
  }

  .cover-title {
    font-family: 'Times New Roman', Times, serif;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    line-height: 1.35;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 0 36px;
    z-index: 4;
    position: relative;
    background: linear-gradient(
      105deg,
      var(--gold3) 20%,
      var(--gold1) 35%,
      var(--gold2) 44%,
      #fff8dc     50%,
      var(--gold2) 56%,
      var(--gold1) 65%,
      var(--gold3) 80%
    );
    background-size: 300% 100%;
    background-position: 120% 0;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    animation: titleShimmer 5s ease-in-out infinite;
    animation-delay: 1.8s;
  }
  @keyframes titleShimmer {
    0%   { background-position: 120% 0; }
    40%  { background-position: -20% 0; }
    100% { background-position: -20% 0; }
  }

  .cover-subtitle {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    color: rgba(201,168,76,0.45);
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 4;
  }

  .notebook.open .cover {
    transform: rotateY(-175deg);
    box-shadow: none;
  }

  /* PAGES BLOCK */
  .pages-block {
    position: absolute;
    inset: 4px 4px 4px 18px;
    background: var(--page-bg);
    border-radius: 0 4px 4px 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease 0.4s;
    box-shadow: inset -1px 0 4px rgba(0,0,0,0.06), 2px 2px 10px rgba(0,0,0,0.08);
  }
  .notebook.open .pages-block { opacity: 1; }

  .ruled-bg {
    position: absolute;
    inset: 0;
    background: var(--page-bg);
  }

  .flip-pages {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .flip-page {
    position: absolute;
    inset: 0;
    background: #f8f8f8;
    transform-origin: left center;
    transform: rotateY(0deg);
    backface-visibility: hidden;
    opacity: 0;
  }

  .page-content {
    position: absolute;
    inset: 0;
    padding: 32px 36px;
    opacity: 0;
    transition: opacity 0.4s ease;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .page-content.visible { opacity: 1; }

  .page-letter {
    font-family: 'Times New Roman', serif;
    font-size: 56px;
    font-weight: bold;
    color: rgba(0,0,0,0.05);
    position: absolute;
    top: 10px;
    right: 16px;
    line-height: 1;
    pointer-events: none;
  }

  .entry-word {
    font-family: 'Times New Roman', Times, serif;
    font-size: 28px;
    font-weight: bold;
    color: var(--ink);
    line-height: 1.15;
    margin-bottom: 6px;
  }

  .entry-phonetic {
    font-family: 'Courier Prime', monospace;
    font-size: 11.5px;
    color: #777;
    font-style: italic;
    margin-bottom: 5px;
  }

  .entry-pos {
    font-family: 'IM Fell English', serif;
    font-size: 12px;
    font-style: italic;
    color: var(--red-accent);
    margin-bottom: 14px;
  }

  .entry-def {
    font-family: 'IM Fell English', serif;
    font-size: 14px;
    color: var(--faded-ink);
    line-height: 1.7;
    border-top: 1px solid var(--soft-border);
    padding-top: 14px;
    max-width: 300px;
  }

  .entry-note {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: #999;
    margin-top: 12px;
    font-style: italic;
    line-height: 1.5;
    max-width: 280px;
  }

  .page-num {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    color: rgba(0,0,0,0.25);
    letter-spacing: 2px;
    text-align: center;
    flex: 1;
    pointer-events: none;
  }

  .nav-dots {
    position: absolute;
    bottom: -44px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .nav-dots.visible { opacity: 1; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(0,0,0,0.18);
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .dot.active {
    background: rgba(0,0,0,0.65);
    transform: scale(1.3);
  }

  .nav-arrows {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .page-content.visible .nav-arrows {
    opacity: 1;
    pointer-events: all;
  }
  .nav-btn {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    color: rgba(0,0,0,0.35);
    cursor: pointer;
    letter-spacing: 1px;
    background: none;
    border: none;
    padding: 2px 4px;
    min-width: 70px;
    transition: color 0.2s;
  }
  .nav-btn:last-child {
    text-align: right;
  }
  .nav-btn:hover { color: var(--red-accent); }

  /* top action buttons row */
  .top-buttons {
    position: absolute;
    top: -44px;
    left: 45%; /* Középre húzza a bal szélét */
    transform: translateX(-45%); /* Pontosan a saját közepéhez igazítja */
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .close-btn {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(0,0,0,0.4);
    background: none;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 3px;
    padding: 5px 12px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, color 0.2s, border-color 0.2s;
  }
  .close-btn.visible {
    opacity: 1;
    pointer-events: all;
  }
  .close-btn:hover {
    color: var(--red-accent);
    border-color: var(--red-accent);
  }

  .surprise-btn {
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(0,0,0,0.55);
    background: none;
    border: 1px solid rgba(0,0,0,0.25);
    border-radius: 3px;
    padding: 5px 12px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, color 0.2s, border-color 0.2s, background 0.2s;
  }
  .surprise-btn.visible {
    opacity: 1;
    pointer-events: all;
  }
  .surprise-btn:hover {
    color: #fff;
    background: var(--ink);
    border-color: var(--ink);
  }

  /* =====================
     MOBILE LAYOUT
     ===================== */
  @media (max-width: 600px) {
    body {
      overflow: hidden;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* Full-screen scene: flex column, gombok felül, notebook alatta */
    .scene {
      width: 100vw;
      height: 100dvh;
      perspective: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 52px;
      box-sizing: border-box;
    }

    /* Notebook fills remaining space */
    .notebook {
      width: 100%;
      max-width: 400px;
      flex: 1;
      max-height: 580px;
      left: 0 !important;
      transition: none;
    }

    /* Override open shift — no lateral movement on mobile */
    .notebook.open {
      left: 0 !important;
    }

    .cover {
      border-radius: 3px 10px 10px 3px;
    }

    .cover-title {
      font-size: 20px;
      padding: 0 28px;
      letter-spacing: 2px;
    }

    /* Pages block matches notebook */
    .pages-block {
      inset: 4px 4px 4px 16px;
    }

    .cover-inner {
      inset: 4px 4px 4px 16px;
    }

    /* Bigger, readable content */
    .page-content {
      padding: 28px 24px 52px;
    }

    .page-letter {
      font-size: 48px;
      top: 8px;
      right: 12px;
    }

    .entry-word {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .entry-phonetic {
      font-size: 11px;
    }

    .entry-pos {
      font-size: 12px;
      margin-bottom: 12px;
    }

    .entry-def {
      font-size: 13.5px;
      line-height: 1.75;
      max-width: 100%;
      padding-top: 12px;
    }

    .entry-note {
      font-size: 11px;
      max-width: 100%;
      margin-top: 10px;
    }

    /* Nav sor: előző | oldalszám | következő — egy sorban */
    .nav-arrows {
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .nav-btn {
      font-size: 12px;
      padding: 0;
      min-width: 80px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .nav-btn:last-child {
      justify-content: flex-end;
    }

    /* Oldalszám — örökli a desktop flex-center stílust, csak méretet igazítunk */
    .page-num {
      font-size: 10px;
    }

    /* Top buttons — a notebook FÖLÖTT, a flex sorrendben */
    .top-buttons {
      position: static;
      transform: none;
      order: -1;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 10px;
      /* mindig látható helyen, de opacity a js vezérli */
    }

    .close-btn,
    .surprise-btn {
      font-size: 11px;
      padding: 8px 14px;
      min-height: 40px;
    }

    /* Hint és nav-dots — notebook alatt, static pozícióban */
    .hint {
      position: static;
      transform: none;
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-align: center;
    }

    .nav-dots {
      position: static;
      transform: none;
      margin-top: 6px;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
    }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="notebook" id="notebook">
    <div class="cover" id="cover">
      <div class="cover-inner"></div>
      <div class="cover-shimmer"></div>
      <div class="cover-ornament">✦</div>
      <div class="cover-title">Urbanisztikai<br>Bullshitszótár</div>
      <div class="cover-subtitle">kattints a nyitáshoz</div>
      <div class="cover-ornament">✦</div>
    </div>

    <div class="pages-block">
      <div class="ruled-bg"></div>
      <div class="flip-pages" id="flipPages"></div>
      <div class="page-content" id="pageContent">
        <div class="page-letter" id="pageLetter"></div>
        <div class="entry-word" id="entryWord"></div>
        <div class="entry-phonetic" id="entryPhonetic"></div>
        <div class="entry-pos" id="entryPos"></div>
        <div class="entry-def" id="entryDef"></div>
        <div class="entry-note" id="entryNote"></div>
        <div class="nav-arrows">
          <button class="nav-btn" onclick="navigate(-1)">← előző</button>
          <div class="page-num" id="pageNum"></div>
          <button class="nav-btn" onclick="navigate(1)">következő →</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">kattints a megnyitáshoz</div>
  <div class="nav-dots" id="navDots"></div>
  <div class="top-buttons">
    <button class="surprise-btn" id="surpriseBtn" onclick="surpriseMe()">✦ Lepj meg!</button>
    <button class="close-btn" id="closeBtn" onclick="closeNotebook()">✕ becsuk</button>
  </div>
</div>

<script>
const entries = [
  { word: "Adaptív utca", phonetic: "[ˈɒdɒptiv ˈut͡sɒ]", pos: "főnév", def: "Ha a tervezési területen van egy jelentős utca, és fogalmad sincs, hogy mit kezdj vele, azonban rákérdeznek mi a terved, pánikszerűen ezt mondd.", note: null, letter: "A" },
  { word: "Bilbao effect", phonetic: "[bilˈbɒʊi ˈɛfɛkt]", pos: "főnév", def: "Ezt a kifejezést akkor használod amikor nem tudod mivel megmagyarázni, hogy a csúnya épületed miért nem illeszkedik a városi környezethez, és nem akarsz valami mást kitalálni.", note: null, letter: "B" },
  { word: "Bottom up", phonetic: "[ˌbɒtəm ˈʌp]", pos: "kifejezés", def: "A top down ellenkezője.", note: null, letter: "B" },
  { word: "Brainstorming", phonetic: "[ˈbreɪnˌstɔːrmɪŋ]", pos: "ige", def: "Akkor csinálják amikor senkinek sincs egy épkézláb ötlete sem a tervezés elkezdésére. Elméletben ez egy kreatív és dinamikus tevékenység, a gyakorlatban ilyenkor mindenki csak abban reménykedik, hogy lesz egy ember, akinek van mondanivalója.", note: null, letter: "B" },
  { word: "Célrendszer", phonetic: "[ˈtseːlˌrɛnd͡sɛr]", pos: "főnév", def: "Amikor valódi munkát nem szeretnél végezni, akkor mindenképpen állíts össze egy célrendszert. Mindenki szereti, mindenki imádja… de mindenbe bele fognak kötni. Nyersz magadnak vele pár nap haladékot.", note: "Léteznek ún. fordított célrendszerek is, amit a mai napig nem érti senki, valószínűleg a feltalálói sem.", letter: "C" },
  { word: "Co-working space", phonetic: "[koʊˈwɜːrkɪŋ speɪs]", pos: "főnév", def: "Valójában még soha senki nem dolgozott valódi co-working space-ben a szerzők közül. Összetevői: egy helyiség, kávé, laptop. Nevezhetnénk akár internet kávézónak is!", note: null, letter: "C" },
  { word: "Ez egy újra!", phonetic: "[ɛz ɛɟ ˈujrɒ]", pos: "kifejezés", def: "Miért? Te mit csináltál éjfél és a reggel nyolcas leadás között?", note: null, letter: "E" },
  { word: "Ez szép?", phonetic: "[ɛz ˈseːp]", pos: "kifejezés", def: "Tegye fel a kezét aki szerint ez szép? És aki szerint nem? Jó és aki nem tette fel a kezét?", note: "Az »Ez szép?« egy beugratós kérdés, valójában nincs rá jó válasz.", letter: "E" },
  { word: "Forgalomtechnika", phonetic: "[ˈforɡɒlomtɛxnɪkɒ]", pos: "főnév", def: "Kifejezetten akkor használjuk, amikor a közlekedési témakör túl komplex és se nem megérteni, se nem kitalálni vagy részletesebben elmondani nem akarjuk.", note: null, letter: "F" },
  { word: "Fenntartható", phonetic: "[ˈfɛntɒrˌtɒ]", pos: "melléknév", def: "A fenntarthatóság fogalma egy rendkívül komplex, multilaterális diskurzus, amely a holisztikus perspektívák szintetikus összefonódására épül. A decentralizált hatalomgyakorlás és a participatív modellek lehetőséget teremtenek a közösségi innovációk kibontakozására.", note: "Ha nem érted nem baj, mi se, a lényeg, hogy második mondatod előtt legyen ott!", letter: "F" },
  { word: "Genius loci", phonetic: "[ˈdʒiːniəs ˈloʊsaɪ]", pos: "kifejezés", def: "Véleményünk szerint ez egy szekta nevét fedi.", note: null, letter: "G" },
  { word: "Hídfőtérség", phonetic: "[ˈhiːd.føː.teːr.ʃeːɡ]", pos: "főnév", def: "Ha a tervezési terület közelében van egy híd, akkor mindenképp ez fog kerülni középpontba. Valószínűleg egyáltalán nem akarsz majd vele foglalkozni, de a hídfőtérség olyan mint egy popsztár, az összes figyelmet rá szegeződik.", note: "Egy potenciális elnevezés az ország tortájára.", letter: "H" },
  { word: "Hívószó", phonetic: "[ˈhiːvoːˌs͡wo]", pos: "főnév", def: "Olyan kifejezés, amelyet akkor használnak, amikor valaki nem rendelkezik elegendő információval egy témáról, de szeretne véleményt formálni vagy kritizálni. Gyakran előfordul: »Nem értem a koncepciót, hiányzik a hívószó.«", note: null, letter: "H" },
  { word: "Hivatásforgalmi kerékpárút", phonetic: "[ˈhivɑtɑʃforɡɑlmi ˈkɛrɛkpaːruːt]", pos: "főnév", def: "Öltönyös aktatáskás emberek szigorú arccal kerékpároznak az iroda felé.", note: null, letter: "H" },
  { word: "Humáninfrastruktúra", phonetic: "[ˈhumɑːnˌinfraʃtrukt̪uːrɒ]", pos: "főnév", def: "Ha az infrastruktúra szót túl műszakinak érzed, akkor tedd elé, hogy humán.", note: null, letter: "H" },

let currentIndex = 0;
let isOpen = false;
let isAnimating = false;

const notebook = document.getElementById('notebook');
const cover = document.getElementById('cover');
const flipPages = document.getElementById('flipPages');
const pageContent = document.getElementById('pageContent');
const hint = document.getElementById('hint');
const navDots = document.getElementById('navDots');
const closeBtn = document.getElementById('closeBtn');
const surpriseBtn = document.getElementById('surpriseBtn');

// Build nav dots
entries.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.onclick = () => goToEntry(i);
  navDots.appendChild(dot);
});

function updateDots(idx) {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });
}

function showEntry(idx, instant = false) {
  const e = entries[idx];
  document.getElementById('pageLetter').textContent = e.letter;
  document.getElementById('entryWord').textContent = e.word;
  document.getElementById('entryPhonetic').textContent = e.phonetic;
  document.getElementById('entryPos').textContent = e.pos;
  document.getElementById('entryDef').textContent = e.def;
  const noteEl = document.getElementById('entryNote');
  if (e.note) {
    noteEl.textContent = '↳ ' + e.note;
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }
  document.getElementById('pageNum').textContent = (idx + 1) + ' / ' + entries.length;
  updateDots(idx);
}

function goToEntry(idx) {
  if (idx === currentIndex || isAnimating) return;
  currentIndex = idx;
  showEntry(idx);
  // quick flash
  pageContent.style.opacity = '0';
  setTimeout(() => { pageContent.style.opacity = '1'; }, 80);
}

function navigate(dir) {
  const newIdx = (currentIndex + dir + entries.length) % entries.length;
  goToEntry(newIdx);
}

function createFlipPage() {
  const p = document.createElement('div');
  p.className = 'flip-page';
  flipPages.appendChild(p);
  return p;
}

function animateFlip(targetIdx, done) {
  isAnimating = true;
  const totalPages = 18;
  let count = 0;
  const pages = [];

  function flipOne() {
    if (count >= totalPages) {
      pages.forEach(p => p.remove());
      isAnimating = false;
      done();
      return;
    }
    const p = createFlipPage();
    pages.push(p);
    const shade = 220 + Math.floor(Math.random() * 30);
    p.style.background = `rgb(${shade},${shade-8},${shade-18})`;
    p.style.opacity = '1';

    p.style.transition = 'none';
    p.style.transform = 'rotateY(0deg)';
    p.style.zIndex = 50 + count;

    requestAnimationFrame(() => {
      const dur = 40 + Math.random() * 60;
      p.style.transition = `transform ${dur}ms ease-in`;
      p.style.transform = 'rotateY(-170deg)';
      setTimeout(() => {
        p.style.opacity = '0';
      }, dur * 0.6);
    });

    count++;
    const delay = 30 + Math.random() * 50;
    setTimeout(flipOne, delay);
  }

  flipOne();

  const midPoint = totalPages * 0.6 * 50;
  setTimeout(() => {
    showEntry(targetIdx);
  }, midPoint);
}

notebook.addEventListener('click', (e) => {
  if (!isOpen) {
    openNotebook();
  }
});

function isMobile() {
  return window.innerWidth <= 600;
}

function openNotebook() {
  if (isOpen || isAnimating) return;
  isAnimating = true;
  hint.style.opacity = '0';

  notebook.classList.add('open');

  const target = Math.floor(Math.random() * entries.length);

  setTimeout(() => {
    animateFlip(target, () => {
      currentIndex = target;
      pageContent.classList.add('visible');
      navDots.classList.add('visible');
      closeBtn.classList.add('visible');
      surpriseBtn.classList.add('visible');
      hint.textContent = 'kattints tovább a nyilakkal';
      hint.style.opacity = '0.4';
      isOpen = true;
      isAnimating = false;
    });
  }, 600);
}

function closeNotebook() {
  if (!isOpen || isAnimating) return;
  isOpen = false;

  pageContent.classList.remove('visible');
  navDots.classList.remove('visible');
  closeBtn.classList.remove('visible');
  surpriseBtn.classList.remove('visible');

  notebook.classList.remove('open');

  hint.textContent = 'kattints a megnyitáshoz';
  hint.style.opacity = '0.3';
}

function surpriseMe() {
  if (!isOpen || isAnimating) return;
  let newIdx;
  do { newIdx = Math.floor(Math.random() * entries.length); }
  while (newIdx === currentIndex && entries.length > 1);
  pageContent.style.opacity = '0';
  setTimeout(() => {
    currentIndex = newIdx;
    showEntry(newIdx);
    pageContent.style.opacity = '1';
  }, 120);
}

// Touch swipe support for mobile
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!isOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // Only horizontal swipes (not scrolls)
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    navigate(dx < 0 ? 1 : -1);
  }
}, { passive: true });
</script>
